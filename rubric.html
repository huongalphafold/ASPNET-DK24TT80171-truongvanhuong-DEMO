<!DOCTYPE html>

<html>
<head>
    <title>Chấm điểm Rubrics</title>
</head>

<body style="font-family:Arial; text-align:center; margin-top:50px; color:#003b7a;">

<h1>CHẤM ĐIỂM TÁC PHẨM</h1>

<p><b>Mã dự thi: DT001</b></p>

<img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=800"
width="450"
style="border-radius:10px; box-shadow:0 0 10px #999;">

<h2>Tác phẩm: Bình minh quê hương</h2>

<p>
Giám khảo xem ảnh, nhập điểm theo Rubrics và ghi nhận xét cho tác phẩm.
</p>

<table border="1" style="margin:auto; border-collapse:collapse; width:700px;">

<tr style="background:#004b96; color:white;">
    <th>Tiêu chí</th>
    <th>Trọng số</th>
    <th>Điểm</th>
</tr>

<tr>
    <td>Bố cục</td>
    <td>25%</td>
    <td><input id="bocuc" type="number" min="1" max="10"></td>
</tr>

<tr>
    <td>Ánh sáng</td>
    <td>25%</td>
    <td><input id="anhsang" type="number" min="1" max="10"></td>
</tr>

<tr>
    <td>Ý tưởng</td>
    <td>25%</td>
    <td><input id="ytuong" type="number" min="1" max="10"></td>
</tr>

<tr>
    <td>Kỹ thuật</td>
    <td>25%</td>
    <td><input id="kythuat" type="number" min="1" max="10"></td>
</tr>

</table>

<br>

<textarea id="nhanxet"
placeholder="Nhận xét giám khảo"
style="width:450px; height:120px;"></textarea>

<br><br>

<button onclick="luuDiem()"
style="
padding:12px 30px;
background:#004b96;
color:white;
border:0;
border-radius:8px;
cursor:pointer;
font-weight:bold;
">

Lưu điểm

</button>

<h3 id="ketqua"></h3>

<br>

<a href="index.html">
<button style="
padding:10px 20px;
background:#0d5cab;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;
">

← Quay lại trang chủ

</button>
</a>

<script>

function luuDiem() {

    var bocuc = Number(document.getElementById("bocuc").value);
    var anhsang = Number(document.getElementById("anhsang").value);
    var ytuong = Number(document.getElementById("ytuong").value);
    var kythuat = Number(document.getElementById("kythuat").value);

    if (!bocuc || !anhsang || !ytuong || !kythuat) {
        alert("Vui lòng nhập đầy đủ điểm cho 4 tiêu chí!");
        return;
    }

    var tongDiem =
        (bocuc * 0.25) +
        (anhsang * 0.25) +
        (ytuong * 0.25) +
        (kythuat * 0.25);

    document.getElementById("ketqua").innerHTML =
        "Điểm trung bình: " + tongDiem.toFixed(2);

    alert("Điểm đã được lưu thành công!");
}

</script>

</body>
</html>
