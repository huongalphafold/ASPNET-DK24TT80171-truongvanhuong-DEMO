<!DOCTYPE html>
<html>
<head>
    <title>Nộp ảnh dự thi</title>
</head>
<body style="font-family:Arial; text-align:center; margin-top:60px; color:#003b7a;">

    <h1>NỘP ẢNH DỰ THI</h1>
    <p>Thí sinh upload từ 1 đến 5 ảnh/bộ ảnh dự thi</p>

    <input type="text" placeholder="Tên tác phẩm" style="padding:12px; width:320px;"><br><br>

    <textarea placeholder="Mô tả tác phẩm" style="padding:12px; width:320px; height:100px;"></textarea><br><br>

    <input type="file" accept=".jpg,.png" multiple><br><br>

    <p>Hệ thống chỉ nhận ảnh JPG/PNG và kiểm tra dung lượng trước khi gửi.</p>

    <button onclick="guiBai()"
style="padding:12px 30px;
background:#004b96;
color:white;
border:0;
border-radius:6px;">

Gửi bài dự thi

</button>

    <br><br>
    <a href="index.html">Quay lại trang chủ</a>

<script>
function guiBai() {

    alert("Bài thi đã được gửi thành công!");

    window.location.href = "index.html";
}
</script>
</html>
